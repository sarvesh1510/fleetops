version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: fleetops_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fleetops
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetops_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=fleetops
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-32-chars-min}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost:80","http://frontend"]
      - SIMULATION_SPEED=${SIMULATION_SPEED:-1.0}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Avoid the generic host DEBUG variable, which is often non-boolean
      # (for example, DEBUG=release) and prevents Pydantic from starting.
      - DEBUG=${FLEETOPS_DEBUG:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleetops_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api/v1
      - VITE_WS_BASE_URL=ws://backend:8000/ws/fleet

volumes:
  mongo_data:

networks:
  default:
    name: fleetops_network
